</style></head><body><h1 id="freeallresults">FreeAllResults</h1>
<p><strong>函数简介：</strong> 释放 22 个通用识别函数及 2 个文字数组函数在所有线程中尚未释放的结果。与 <code>FreeAllStringResults()</code> 功能、释放范围及返回规则完全相同，建议统一使用本函数；一次清理只调用其中一个即可。</p>
<p><strong>函数原型：</strong></p>
<pre><code>
int WINAPI FreeAllResults(void);
</code></pre>
<p><strong>参数定义：</strong> 无。</p>
<p><strong>返回值：</strong> 1 成功；无结果、重复调用也成功；0 失败。</p>
<p><strong>示例：</strong></p>
<pre><code>
FreeAllResults()
</code></pre>

<p><strong>完整调用实例：</strong>请参阅<a href="WanZhengDiaoyong.html#template">FreeAllResults 所属工作流</a>，其中包含前置设置、调用及结果/资源处理。</p>
