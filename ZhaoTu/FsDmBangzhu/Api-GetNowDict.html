</style></head><body><h1 id="getnowdict">GetNowDict</h1>
<p><strong>函数简介：</strong></p>
<p>获取当前选择的点阵字库编号。</p>
<p><strong>函数原型：</strong></p>
<pre><code>
int WINAPI GetNowDict(void);
</code></pre>
<p><strong>参数定义：</strong></p>
<ul>
<li>无。</li>
</ul>
<p><strong>返回值：</strong></p>
<ul>
<li>当前选择编号，范围 0～99；这是编号，不是成功或失败标志。</li>
</ul>
<p><strong>示例：</strong></p>
<pre><code>
GetNowDict()
</code></pre>
<p><strong>注意：</strong> 默认编号为 0。返回编号不保证该字库已经加载，清空字库不会自动改选其他编号。</p>
