<h1 id="getframenumber">调试函数：GetFrameNumber</h1>
<p><strong>函数用途：</strong>查看当前绑定窗口已发布的采集快照编号，并可在工作台持续观察编号变化，用于调试采集帧更新。</p>
<h2>参数</h2>
<p><code>output</code> 为输出开关：传入 1 时开启工作台编号监视，传入 0 时关闭。工作台约每 10 毫秒检查一次，仅在编号变化时输出；解绑或绑定版本变化后自动停止。未绑定或尚无快照时返回 0。</p>
<h2>工作台示例</h2>
<pre><code>GetFrameNumber(1)
GetFrameNumber(0)</code></pre>

<p><strong>完整调用实例：</strong>请参阅<a href="WanZhengDiaoyong.html#binding">GetFrameNumber 所属工作流</a>，其中包含前置设置、调用及结果/资源处理。</p>
